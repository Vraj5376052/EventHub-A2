name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm test

  deploy:
    name: Deploy to ${{ matrix.label }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # One job per instance, running in parallel. fail-fast is off on purpose:
    # a problem on one instance must not cancel the deploy to the other, which
    # is the same independence NFR-05 asks for at runtime.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: instance-a
            host_secret: EC2_HOST_A
          - label: instance-b
            host_secret: EC2_HOST_B

    steps:
      - name: Write the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

      - name: Trust the host key
        run: ssh-keyscan -H "${{ secrets[matrix.host_secret] }}" >> ~/.ssh/known_hosts

      - name: Pull, install and reload
        run: |
          ssh -i ~/.ssh/deploy.pem \
              "${{ secrets.EC2_USER }}@${{ secrets[matrix.host_secret] }}" \
              'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/EventHub-A2
          git fetch origin main
          git reset --hard origin/main
          cd backend && npm ci --omit=dev
          cd ../frontend && npm ci
          cd ..
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
          REMOTE

      - name: Confirm the instance came back
        run: |
          ssh -i ~/.ssh/deploy.pem \
              "${{ secrets.EC2_USER }}@${{ secrets[matrix.host_secret] }}" \
              'for i in 1 2 3 4 5 6; do curl -fsS --max-time 5 http://localhost:5001/api/health && exit 0; sleep 5; done; exit 1'

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy.pem