name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm test

  # The deploy runs on a self-hosted runner installed on each EC2 instance
  # rather than over SSH from a GitHub-hosted runner. The university firewall
  # only admits campus addresses, so no GitHub runner can reach port 22; the
  # self-hosted agent needs outbound traffic only, and no SSH key or host
  # address has to be stored as a secret at all (NFR-06).
  deploy:
    name: Deploy on ${{ matrix.label }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # One job per instance, in parallel. fail-fast is off on purpose: a
    # problem on one instance must not cancel the deploy to the other, which
    # is the same independence NFR-05 asks for at runtime.
    strategy:
      fail-fast: false
      matrix:
        label: [instance-a, instance-b]

    runs-on:
      - self-hosted
      - ${{ matrix.label }}

    # The runner deploys into the standing clone, not its own workspace, so
    # the PM2 processes keep pointing at the same directory across deploys.
    defaults:
      run:
        working-directory: /home/ubuntu/EventHub-A2

    steps:
      - name: Update the code to main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: /home/ubuntu/EventHub-A2/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: /home/ubuntu/EventHub-A2/frontend

      - name: Reload PM2
        run: |
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save

      - name: Confirm the instance came back
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 http://localhost:5001/api/health && exit 0
            sleep 5
          done
          exit 1